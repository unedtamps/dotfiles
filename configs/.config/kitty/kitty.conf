# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

# Cursors
cursor                  #c0caf5
cursor_text_color       #1a1b26
cursor_shape beam
cursor_underline_thickness 2
cursor_blink_interval -1
cursor_stop_blinking_after 15

# Scrollback
scrollback_lines 2000

# Mouse
url_color                #7dcfff

copy_on_select yes
default_pointer_shape beam
pointer_shape_when_dragging beam
mouse_map middle release ungrabbed paste_from_selection

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor no

# Window layout
startup_session none
linux_display_server auto
# linux_display_server x11
remember_window_size  no
initial_window_width  2560
initial_window_height 1440
enabled_layouts *
window_resize_step_cells 1
window_resize_step_lines 1
window_border_width 1
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
window_padding_width 8
single_window_padding_width -1
placement_strategy center
active_border_color   #7aa2f7
inactive_border_color #292e42
bell_border_color     #e0af68
hide_window_decorations yes
resize_debounce_time 0.05 0.05
confirm_os_window_close 0
wayland_titlebar_color background

# Tab bar
tab_bar_edge bottom
tab_bar_margin_width 6.0
tab_bar_margin_height 4.0 2.0
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_title_template "{index} {title}"
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #1f2335
tab_bar_background      #16161e

# Tokyo Night (Night) color scheme
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #33467c
background_opacity 0.55
background_blur 0
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #7dcfff
color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

shell /home/nedo/.config/kitty/tmux-picker.sh

# Advanced
# allow_remote_control yes

# Keyboard shortcuts
# clear_all_shortcuts yes
# map alt+c copy_to_clipboard
# map alt+v paste_from_clipboard
# map alt+enter new_window
# map alt+w close_window
# map ctrl+tab next_window
# map alt+tab previous_window
# map alt+r start_resizing_window
# map alt+right next_tab
# map alt+left previous_tab
# map alt+t new_tab
# map alt+q close_tab
# map alt+up move_tab_forward
# map alt+down move_tab_backward
# map alt+n set_tab_title
# map alt+l next_layout
# map alt+kp_add change_font_size all +2.0
# map alt+kp_subtract change_font_size all -2.0
# map alt+backspace change_font_size all 0
# map alt+f5 load_config_file

# Send Ctrl+Shift+hjkl as Ctrl+Shift+arrows so tmux can resize panes
# reliably (shifted letters are ambiguous between kitty and tmux).
map ctrl+shift+h send_key ctrl+shift+left
map ctrl+shift+j send_key ctrl+shift+down
map ctrl+shift+k send_key ctrl+shift+up
map ctrl+shift+l send_key ctrl+shift+right

# Ctrl+Tab / Ctrl+Shift+Tab → next / previous tmux window.
map ctrl+tab send_text all \e[6;5~
map ctrl+shift+tab send_text all \e[5;5~

# Super+Tab / Super+Shift+Tab → next / previous tmux session.
map super+tab send_text all \e[6;3~
map super+shift+tab send_text all \e[5;3~
