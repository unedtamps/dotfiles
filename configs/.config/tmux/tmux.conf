unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on
setw -g mode-keys vi

bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Resize panes with Ctrl+Shift+hjkl (no prefix). Kitty remaps these to
# Ctrl+Shift+arrows so tmux gets an unambiguous key sequence.
bind -nr C-S-Left resize-pane -L 2
bind -nr C-S-Down resize-pane -D 2
bind -nr C-S-Up resize-pane -U 2
bind -nr C-S-Right resize-pane -R 2

# Ctrl+Tab: popup switcher with Tokyo Night style. Nudge CSI-u sequences too —
# kitty may report Ctrl+Tab / Ctrl+Shift+Tab as \e[9;5u / \e[9;6u.
bind -n C-PageDown display-popup -E -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7" -w 60% -h 40% -T " windows " "/home/nedo/.config/tmux/window-switcher.sh" "--next"
bind -n C-PageUp   display-popup -E -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7" -w 60% -h 40% -T " windows " "/home/nedo/.config/tmux/window-switcher.sh" "--prev"
bind -n C-Tab      display-popup -E -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7" -w 60% -h 40% -T " windows " "/home/nedo/.config/tmux/window-switcher.sh" "--next"
bind -n C-S-Tab    display-popup -E -s "bg=#1a1b26,fg=#c0caf5" -S "fg=#7aa2f7" -w 60% -h 40% -T " windows " "/home/nedo/.config/tmux/window-switcher.sh" "--prev"

# Super+Tab: next/previous session directly (no popup).
bind -n M-NPage switch-client -n
bind -n M-PPage switch-client -p

# Easier and faster switching between next/prev window
bind C-v previous-window
bind C-n next-window

# Open new window/pane in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g status-position top


# List of plugins
set -g allow-passthrough on
# Propagate the outer terminal identity to panes so Yazi can detect Kitty
# graphics support through tmux.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @tokyo-night-tmux_theme night    # storm | day | default to 'night'
set -g @tokyo-night-tmux_transparent 1  # 1 or 0
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style dsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare

# Icon styles
set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 

# No extra spaces between icons
set -g @tokyo-night-tmux_window_tidy_icons 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_git 0
# set -g status-right ""

# set -g @tokyo-night-tmux_path_format relative # 'relative' or 'full'
# set -g @tokyo-night-tmux_show_datetime 1
# set -g @tokyo-night-tmux_show_git 1            # local git status
# set -g @tokyo-night-tmux_show_wbg 1             # GitHub / GitLab stats
# set -g @tokyo-night-tmux_show_path 1            # current path

# Month/Day/Year
# set -g @tokyo-night-tmux_date_format "%m/%d/%Y"

# # 12 hour format
# set -g @tokyo-night-tmux_time_format "%I:%M %p"


set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
